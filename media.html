<head>
    <meta charset="UTF-8">

    <title>Multimedia – Stefan Röser</title>

    <style>
        /* Grunddesign im Buchpapier-Stil – identisch zu den anderen Seiten */
        body { 
            font-family: 'Inter', Arial, sans-serif; 
            line-height: 1.8; 
            max-width: 940px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            color: #3e3a36; 
            background-color: #fcfbfa; /* Warmes Weiß */
        }

        /* Elegante, flache Navigation */
        .nav-container {
            border-bottom: 1px solid #e8e5e1;
            padding-bottom: 20px;
            margin-bottom: 60px;
        }
        .nav-tabs {
            display: flex;
            justify-content: center; 
            gap: 35px;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-tabs a {
            text-decoration: none;
            color: #6e665e; 
            font-weight: 500;
            font-size: 1.05em;
            padding: 8px 4px;
            transition: all 0.3s ease;
            position: relative;
        }
        /* Feiner Unterstrich bei Aktivität */
        .nav-tabs a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #8B2626;
            transition: width 0.3s ease;
        }
        .nav-tabs a:hover::after, .nav-tabs a.active::after {
            width: 100%;
        }
        .nav-tabs a:hover {
            color: #8B2626;
        }
        .nav-tabs a.active {
            color: #8B2626;
            font-weight: 600;
        }
