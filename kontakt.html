<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt – Stefan Rösner</title>
    <style>
        /* Buchpapier-Stil Grundlagen */
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #f9f7f1; /* Papierfarbe */
            color: #2c2c2c;
            line-height: 1.7;
            margin: 0;
            padding: 2rem 1rem;
        }

        .page-wrapper {
            max-width: 820px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            padding: 3rem 2.5rem;
            border: 1px solid #e8e2d6;
        }

        h1 {
            font-size: 2rem;
            font-weight: normal;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #d4cbb8;
            padding-bottom: 0.75rem;
            margin-top: 0;
            color: #3a3226;
        }

        p.intro {
            font-size: 1.05rem;
            color: #4a4238;
            margin-bottom: 2rem;
        }

        /* Formular-Container */
        .form-container {
            position: relative;
            width: 100%;
            margin-top: 1.5rem;
        }

        /* WICHTIG: Das iframe wird auf 100% Breite gesetzt, um sich dem Layout anzupassen */
        .form-container iframe {
            display: block;
            width: 100%;
            border: 1px solid #e0d9cc;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Rücklink */
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #5a4e3c;
            text-decoration: none;
            border-bottom: 1px dotted #b0a48e;
        }

        .back-link:hover {
            color: #1a1a1a;
            border-bottom-style: solid;
        }

        /* Mobile Anpassung */
        @media (max-width: 600px) {
            .page-wrapper {
                padding: 2rem 1.25rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <h1>Kontakt</h1>
        <p class="intro">
            Für Anfragen, Feedback oder Kooperationsvorschläge nutzen Sie bitte das folgende Formular.
            Ich bemühe mich, so bald wie möglich zu antworten.
        </p>

        <!-- Google Forms Einbettung -->
        <div class="form-container">
            <!-- KOPIERE JETZT DEN VOLLSTÄNDIGEN SRC-LINK AUS DEM GOOGLE-DIALOG HIER HINEIN -->
            <!-- Achte darauf, dass "?embedded=true" am Ende der URL steht! -->
            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSfySdtidYQlB--TdDI.../viewform?embedded=true"
                width="100%"
                height="850"
                frameborder="0"
                marginheight="0"
                marginwidth="0"
                title="Kontaktformular">
                Wird geladen…
            </iframe>
        </div>

        <a href="index.html" class="back-link">← Zurück zur Startseite</a>
    </div>

</body>
</html>
