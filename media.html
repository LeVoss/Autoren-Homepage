<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media – Stefan Röser</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', Arial, sans-serif; 
            line-height: 1.7; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            color: #4a5568; 
            background-color: #ffffff;
        }

        /* Navigation */
        .nav-container {
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 40px;
            width: 100%;
        }
        .nav-tabs {
            display: flex;
            justify-content: center; 
            align-items: center;
            gap: 30px;
            list-style: none;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }
        .nav-tabs li {
            margin: 0;
            padding: 0;
        }
        .nav-tabs a {
            text-decoration: none;
            color: #4a5568; 
            font-size: 0.95em;
            padding: 6px 2px;
            position: relative;
            white-space: nowrap;
            display: inline-block;
            transition: color 0.2s ease;
        }
        .nav-tabs a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #8b2626;
            transition: width 0.3s ease;
        }
        .nav-tabs a:hover::after, .nav-tabs a.active::after {
            width: 100%;
        }
        .nav-tabs a:hover, .nav-tabs a.active {
            color: #8b2626;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h1 { 
            font-family: 'Playfair Display', Georgia, serif;
            color: #7a1f1f;
            font-size: 2.6em; 
            font-weight: 700;
            margin-bottom: 10px; 
        }
        .page-header .subtitle {
            font-size: 1em;
            color: #718096;
            margin: 0 auto;
        }

        /* Content-Bereich */
        .media-container {
            margin-bottom: 50px;
        }

        .media-card {
            background-color: #ffffff;
            border: 1px solid #edf2f7;
            border-left: 4px solid #8b2626;
            border-radius: 4px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .media-card h2 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #7a1f1f;
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .no-media {
            background-color: #fcfaf7;
            border-left: 4px solid #8b2626;
            padding: 30px 35px;
            border-radius: 2px;
            text-align: center;
        }

        .no-media p {
            font-size: 1em;
            color: #4a5568;
            margin: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.95em;
            color: #718096;
            margin-top: 80px;
            border-top: 1px solid #edf2f7;
            padding-top: 30px;
        }
        footer a {
            color: #4a5568;
            text-decoration: underline;
            margin: 0 10px;
            transition: color 0.2s ease;
        }
        footer a:hover {
            color: #8b2626;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .nav-tabs {
                gap: 15px;
            }
        }
    </style>
</head>

            <li><a href="media.html" class="active">Media</a></li>
            <li><a href="lesetipps.html">Lesetipps</a></li>
        </ul>
    </div>

    <!-- Header -->
    <div class="page-header">
        <h1>Media</h1>
        <p class="subtitle">Presseberichte, Interviews & Downloads</p>
    </div>

    <!-- Media Content -->
    <div class="media-container">
        <div class="no-media">
            <p>Derzeit stehen keine Medieninhalte zur Verfügung. Inhalte wie Presseartikel und Interviews werden hier in Kürze zu finden sein.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Stefan Röser</p>
        <p>
            <a href="impressum.html">Impressum</a> | 
            <a href="datenschutz.html">Datenschutz</a>
        </p>
    </footer>

</body>
</html>
